# ---------------------------------------------------------------------------
#  前端容器站点配置
#  位置：容器内 /etc/nginx/conf.d/default.conf（覆盖 nginx:alpine 的默认站点）
#
#  这里只写 server 块 —— 主配置 nginx.conf 里的 http {} 与
#  `include /etc/nginx/conf.d/*.conf` 由官方镜像提供，不必重复。
# ---------------------------------------------------------------------------
server {
    listen      80;
    server_name _;
    server_tokens off;              # 不回显 nginx 版本号

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 上传体积上限。nginx 默认只有 1m，而报修工单支持上传故障照片
    # （前端单图限 5MB；后端 spring.servlet.multipart 限 10MB/请求 20MB）。
    # 不放开这一行，上传 1MB 以上的图片会直接被 nginx 拦成 HTTP 413，
    # 前端只弹「上传失败」，后端日志里连一条记录都没有 —— 极难排查。
    client_max_body_size 20m;

    # ---- SPA history 路由 ---------------------------------------------------
    # 刷新 /laboratory/asset 这类深链接时磁盘上没有对应文件，
    # 必须回落到 index.html 交给 vue-router 处理，否则 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 带 hash 的静态资源：长缓存 -----------------------------------------
    # vite 产物文件名含内容 hash，内容变则文件名变，可以放心 immutable。
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- index.html：绝不缓存 ----------------------------------------------
    # 缓存住这一张，前端发版后用户会拿着旧壳子去请求已被删除的 chunk，
    # 表现为白屏 + 一堆 404，而清缓存前无法自愈。
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- 后端接口反代 -------------------------------------------------------
    # 用 ^~ 修饰：命中该前缀后不再去匹配下面的正则 location，
    # 避免接口路径里恰好带 .js/.css 之类后缀时被静态资源规则抢走。
    location ^~ /prod-api/ {
        # 【末尾这个 / 绝对不能删，它决定前缀剥不剥】
        #   带 / ： /prod-api/login  →  http://lab-backend:8080/login   ✅
        #   不带 ： /prod-api/login  →  http://lab-backend:8080/prod-api/login ❌ 后端 404
        # 前端 .env.production 里 VITE_APP_BASE_API = '/prod-api'，全靠这行对齐。
        proxy_pass http://lab-backend:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 清掉 Connection 才能走 keep-alive，否则每个请求都新建连接
        proxy_set_header Connection        "";

        # 资产 Excel 导出、看板聚合查询可能偏慢，默认 60s 容易误判超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 上传走这个前缀，同样不能低于 server 级的 20m
        client_max_body_size 20m;
    }

    # ---- 压缩 ---------------------------------------------------------------
    gzip            on;
    gzip_vary       on;          # 补 Vary: Accept-Encoding，避免中间缓存串味
    gzip_comp_level 6;
    gzip_min_length 1k;
    # 构建期 vite-plugin-compression 已按 VITE_BUILD_COMPRESS=gzip 生成 .gz，
    # gzip_static 命中时直接发预压缩文件，省掉每次请求的实时压缩开销。
    # （官方 nginx 镜像已编译该模块；若某天产物里没有 .gz，会自动回落到动态 gzip）
    gzip_static     on;
    gzip_types      text/plain text/css text/xml
                    application/json application/javascript
                    application/xml application/xml+rss
                    application/x-javascript image/svg+xml;
}

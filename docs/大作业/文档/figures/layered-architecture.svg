<?xml version="1.0" encoding="UTF-8"?>
<!--
  图 2-1　系统分层架构图
  用途：架构设计文档 2.1 节；同时供答辩 PPT 第 3 页矢量重绘参考。
  说明：纯手写 SVG（无外部依赖），字体用系统中文字体。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" width="1160" height="760"
     font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7a6f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="760" fill="#ffffff"/>

  <!-- ================= 展示层 ================= -->
  <rect x="20" y="18" width="1120" height="118" rx="6" fill="#fdfcfb" stroke="#c9c3bb" stroke-width="1.5"/>
  <rect x="20" y="18" width="150" height="118" rx="6" fill="#efe9e4" stroke="#b8a89c" stroke-width="1.5"/>
  <text x="95" y="66" text-anchor="middle" font-size="17" font-weight="bold" fill="#5b3f2f">展示层</text>
  <text x="95" y="90" text-anchor="middle" font-size="11" fill="#7a6a60">Presentation</text>

  <rect x="192" y="36" width="290" height="82" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="337" y="62" text-anchor="middle" font-size="13" fill="#1a1a1a">Vue 3 + Element Plus</text>
  <text x="337" y="82" text-anchor="middle" font-size="13" fill="#1a1a1a">Pinia（状态）+ ECharts（图表）</text>
  <text x="337" y="102" text-anchor="middle" font-size="11.5" fill="#6a6a6a">Vite 6 构建</text>

  <rect x="502" y="36" width="300" height="82" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="652" y="58" text-anchor="middle" font-size="12.5" fill="#1a1a1a">房间 / 资产 / 报修 三个业务页</text>
  <text x="652" y="78" text-anchor="middle" font-size="12.5" fill="#1a1a1a">运维工作台（4 指标 + 4 图）</text>
  <text x="652" y="102" text-anchor="middle" font-size="11.5" fill="#6a6a6a">二维码弹窗 · 时间线 · 图片上传 · 拖拽导入</text>

  <rect x="822" y="36" width="300" height="82" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="972" y="62" text-anchor="middle" font-size="12.5" fill="#1a1a1a">api/laboratory/*.js　接口封装</text>
  <text x="972" y="88" text-anchor="middle" font-size="12.5" fill="#1a1a1a">utils/labPermission.js　按钮显隐</text>
  <text x="972" y="107" text-anchor="middle" font-size="11" fill="#a0522d">※ 仅控制显隐，不是安全边界</text>

  <!-- 展示层 -> 业务层 -->
  <line x1="580" y1="136" x2="580" y2="176" stroke="#8a7a6f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="596" y="163" font-size="11.5" fill="#7a6a60">HTTP / JSON　axios（/dev-api 经 Vite 代理）</text>

  <!-- ================= 业务层 ================= -->
  <rect x="20" y="180" width="1120" height="232" rx="6" fill="#fdfcfb" stroke="#c9c3bb" stroke-width="1.5"/>
  <rect x="20" y="180" width="150" height="232" rx="6" fill="#efe9e4" stroke="#b8a89c" stroke-width="1.5"/>
  <text x="95" y="290" text-anchor="middle" font-size="17" font-weight="bold" fill="#5b3f2f">业务层</text>
  <text x="95" y="312" text-anchor="middle" font-size="11" fill="#7a6a60">Business / Service</text>
  <text x="95" y="332" text-anchor="middle" font-size="10.5" fill="#7a6a60">Spring Boot 单体 JAR</text>
  <text x="95" y="348" text-anchor="middle" font-size="10.5" fill="#7a6a60">端口 8080</text>

  <!-- 接口层 -->
  <text x="192" y="202" font-size="12.5" font-weight="bold" fill="#5b3f2f">接口层 Controller</text>
  <text x="470" y="202" font-size="11" fill="#6a6a6a">参数接收 · @PreAuthorize 权限校验 · 统一响应封装</text>
  <rect x="192" y="210" width="228" height="40" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="306" y="235" text-anchor="middle" font-size="12" fill="#1a1a1a">LabRoomController</text>
  <rect x="430" y="210" width="228" height="40" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="544" y="235" text-anchor="middle" font-size="12" fill="#1a1a1a">LabAssetController</text>
  <rect x="668" y="210" width="228" height="40" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="782" y="235" text-anchor="middle" font-size="12" fill="#1a1a1a">LabRepairController</text>
  <rect x="906" y="210" width="216" height="40" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="1014" y="235" text-anchor="middle" font-size="12" fill="#1a1a1a">LabDashboardController</text>

  <!-- 服务层 -->
  <text x="192" y="282" font-size="12.5" font-weight="bold" fill="#5b3f2f">服务层 Service</text>
  <text x="470" y="282" font-size="11" fill="#6a6a6a">业务规则 · 状态机校验 · 数据行级过滤 · 事务边界</text>
  <rect x="192" y="290" width="228" height="40" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="306" y="315" text-anchor="middle" font-size="12" fill="#1a1a1a">ILabRoomService</text>
  <rect x="430" y="290" width="228" height="40" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="544" y="315" text-anchor="middle" font-size="12" fill="#1a1a1a">ILabAssetService</text>
  <rect x="668" y="290" width="228" height="40" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="782" y="315" text-anchor="middle" font-size="12" fill="#1a1a1a">ILabRepairService</text>
  <rect x="906" y="290" width="216" height="40" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="1014" y="315" text-anchor="middle" font-size="12" fill="#1a1a1a">ILabDashboardService</text>

  <!-- 支撑件 -->
  <text x="192" y="362" font-size="12.5" font-weight="bold" fill="#5b3f2f">支撑件</text>
  <text x="470" y="362" font-size="11" fill="#6a6a6a">业务层内被复用的「公共规则中枢」</text>
  <rect x="192" y="370" width="176" height="32" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="280" y="391" text-anchor="middle" font-size="11" fill="#1a1a1a">LabRoleUtils　角色判定</text>
  <rect x="378" y="370" width="176" height="32" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="466" y="391" text-anchor="middle" font-size="11" fill="#1a1a1a">LabConstants　状态常量</text>
  <rect x="564" y="370" width="176" height="32" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="652" y="391" text-anchor="middle" font-size="11" fill="#1a1a1a">LabStatusUtils　状态文案</text>
  <rect x="750" y="370" width="180" height="32" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="840" y="391" text-anchor="middle" font-size="11" fill="#1a1a1a">LabSecurityUtils　取操作人</text>
  <rect x="940" y="370" width="182" height="32" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="1031" y="391" text-anchor="middle" font-size="11" fill="#1a1a1a">QrCodeUtils　二维码生成</text>

  <!-- 业务层 -> 持久化层 -->
  <line x1="580" y1="412" x2="580" y2="452" stroke="#8a7a6f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="596" y="439" font-size="11.5" fill="#7a6a60">MyBatis　Mapper 接口 + XML 映射</text>

  <!-- ================= 持久化层 ================= -->
  <rect x="20" y="456" width="1120" height="116" rx="6" fill="#fdfcfb" stroke="#c9c3bb" stroke-width="1.5"/>
  <rect x="20" y="456" width="150" height="116" rx="6" fill="#efe9e4" stroke="#b8a89c" stroke-width="1.5"/>
  <text x="95" y="506" text-anchor="middle" font-size="17" font-weight="bold" fill="#5b3f2f">持久化层</text>
  <text x="95" y="528" text-anchor="middle" font-size="11" fill="#7a6a60">Persistence</text>

  <rect x="192" y="474" width="252" height="80" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="318" y="498" text-anchor="middle" font-size="12" fill="#1a1a1a">业务 Mapper × 5</text>
  <text x="318" y="520" text-anchor="middle" font-size="10.5" fill="#6a6a6a">Room / Asset / Repair</text>
  <text x="318" y="538" text-anchor="middle" font-size="10.5" fill="#6a6a6a">AssetRecord / RepairRecord</text>

  <rect x="456" y="474" width="252" height="80" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="582" y="498" text-anchor="middle" font-size="12" fill="#1a1a1a">LabDashboardMapper</text>
  <text x="582" y="522" text-anchor="middle" font-size="10.5" fill="#6a6a6a">统计聚合 · 只读</text>
  <text x="582" y="540" text-anchor="middle" font-size="10.5" fill="#6a6a6a">独立于业务服务</text>

  <rect x="720" y="474" width="402" height="80" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="921" y="498" text-anchor="middle" font-size="12" fill="#1a1a1a">resources/mybatis/laboratory/*.xml（6 份）</text>
  <text x="921" y="522" text-anchor="middle" font-size="10.5" fill="#6a6a6a">resultMap 显式字段映射</text>
  <text x="921" y="540" text-anchor="middle" font-size="10.5" fill="#a0522d">※ 框架通配符扫描，新增子包无需改配置</text>

  <!-- 持久化层 -> 数据库层 -->
  <line x1="580" y1="572" x2="580" y2="612" stroke="#8a7a6f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="596" y="599" font-size="11.5" fill="#7a6a60">JDBC　Druid 连接池</text>

  <!-- ================= 数据库层 ================= -->
  <rect x="20" y="616" width="1120" height="128" rx="6" fill="#fdfcfb" stroke="#c9c3bb" stroke-width="1.5"/>
  <rect x="20" y="616" width="150" height="128" rx="6" fill="#efe9e4" stroke="#b8a89c" stroke-width="1.5"/>
  <text x="95" y="670" text-anchor="middle" font-size="17" font-weight="bold" fill="#5b3f2f">数据库层</text>
  <text x="95" y="692" text-anchor="middle" font-size="11" fill="#7a6a60">Database</text>

  <rect x="192" y="634" width="612" height="92" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="498" y="658" text-anchor="middle" font-size="12.5" fill="#1a1a1a">MySQL 8　库 education_system</text>
  <text x="498" y="682" text-anchor="middle" font-size="11" fill="#444">业务表 5 张：lab_room · lab_asset · lab_repair · lab_asset_record · lab_repair_record</text>
  <text x="498" y="704" text-anchor="middle" font-size="11" fill="#444">字典 4 组：资产类型 · 资产状态 · 故障等级 · 报修状态（走框架通用字典）</text>
  <text x="498" y="721" text-anchor="middle" font-size="10.5" fill="#a0522d">※ 一律逻辑删除（del_flag），业务编号只建普通索引</text>

  <rect x="820" y="634" width="302" height="92" rx="4" fill="#fbfaf8" stroke="#c9c3bb"/>
  <text x="971" y="662" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Redis</text>
  <text x="971" y="686" text-anchor="middle" font-size="11" fill="#444">登录态与验证码</text>
  <text x="971" y="708" text-anchor="middle" font-size="10.5" fill="#6a6a6a">单体部署，无高可用（范围外）</text>
</svg>
